<!DOCTYPE html>
<html lang="vi">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Câu 14 - Chuyển theme sáng / tối</title>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="Styles/style.css">
</head>

<body class="light">

    <!--IMAGE EFFECT: on.png = nền sáng, off.png = nền tối-->
    <div class="image-effect" id="image-effect-2">
        <img src="Images/off.png" id="img-off" alt="Theme tối">
        <img src="Images/on.png" id="img-on" class="fadeEffect" alt="Theme sáng">
    </div>

    <!--Switch Button-->
    <div class="switch-btn">
        <div class="onoffswitch">
            <input type="checkbox" name="onoffswitch" class="onoffswitch-checkbox toggle-switch-2" id="myonoffswitch" tabindex="0" checked>
            <label class="onoffswitch-label" for="myonoffswitch">
            <span class="onoffswitch-inner"></span>
            <span class="onoffswitch-switch"></span>
            </label>
        </div>
        <span class="theme-label" id="themeLabel">Theme sáng</span>
    </div>

    <script src="Scripts/jquery-latest.min.js"></script>
    <script src="Scripts/cau14.js"></script>

</body>

</html>
