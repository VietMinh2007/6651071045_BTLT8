<!DOCTYPE html>
<html lang="vi">
    <head>
        <title>Câu 15 - Tạo tabs trong jQuery</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="Styles/style.css">
    </head>
    <body>
        <div class="tab-wrapper">
            <ul class="tab">
                <li class="active">
                    <a href="#tab-main-info">Thông tin chính</a>
                </li>
                <li>
                    <a href="#tab-image">Hình ảnh</a>
                </li>
                <li>
                    <a href="#tab-seo">SEO</a>
                </li>
            </ul>
            <div class="tab-content">
                <div class="tab-item" id="tab-main-info">
                    Tab thông tin chính
                </div>
                <div class="tab-item" id="tab-image">
                    Tab hình ảnh
                </div>
                <div class="tab-item" id="tab-seo">
                    Tab SEO
                </div>
            </div>
        </div>

        <script src="Scripts/jquery-latest.min.js"></script>
        <script src="Scripts/cau15.js"></script>
    </body>
</html>
