<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Câu 16 - Thêm và xóa hàng trong Table</title>
<!-- jQuery UI chỉ dùng cho Datepicker (cần Internet). Nếu offline vẫn nhập tay được dd/mm/yyyy -->
<link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
<link rel="stylesheet" type="text/css" href="Styles/style.css">
</head>
<body style="border:1px solid grey">
    <h2>Quản lý thông tin user</h2>
    <form onsubmit="return false;">
        <input type="text" id="name" placeholder="Name">
        <input type="text" id="email" placeholder="Email Address">
        <input type="text" placeholder="Birthdate" id="datepicker" autocomplete="off">
        <input type="button" class="add-row" value="Add Row">
    </form>
    <div class="error-msg" id="errorMsg"></div>
    <table>
        <thead>
            <tr>
                <th>Select</th>
                <th>Name</th>
                <th>Email</th>
                <th>Birthdate</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <button type="button" class="delete-row">Delete Row</button>

    <script src="Scripts/jquery-latest.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script src="Scripts/cau16.js"></script>
</body>
</html>
